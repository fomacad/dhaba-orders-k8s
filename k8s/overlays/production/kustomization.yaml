apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

# Same image tags that passed staging (the pipeline copies them across).
images:
  - name: web
    newName: 774527927491.dkr.ecr.ap-southeast-2.amazonaws.com/dhaba-firewall-force/web
    newTag: 3c97d5cc1354e9e7f937acb3ab36bdc40d85ce80
  - name: menu-api
    newName: 774527927491.dkr.ecr.ap-southeast-2.amazonaws.com/dhaba-firewall-force/menu-api
    newTag: 726c4fbfef3d48913661561833e9f59ac12e2456
  - name: orders-api
    newName: 774527927491.dkr.ecr.ap-southeast-2.amazonaws.com/dhaba-firewall-force/orders-api
    newTag: f2850317222276571422069b263fa76dacfa75e8
  - name: stats-api
    newName: 774527927491.dkr.ecr.ap-southeast-2.amazonaws.com/dhaba-firewall-force/stats-api
    newTag: 726c4fbfef3d48913661561833e9f59ac12e2456
  - name: kitchen-worker
    newName: 774527927491.dkr.ecr.ap-southeast-2.amazonaws.com/dhaba-firewall-force/kitchen-worker
    newTag: 726c4fbfef3d48913661561833e9f59ac12e2456

# Production: 1 replica of everything (the 2-replica design needs a bigger VM). menu-api (2 gunicorn workers per pod)
# and kitchen-worker (JVM) stay at 1 because the VM has only ~2 GB of RAM.
replicas:
  - name: web
    count: 1
  - name: menu-api
    count: 1
  - name: orders-api
    count: 1
  - name: stats-api
    count: 1
  - name: kitchen-worker
    count: 1

patches:
  # hostname for both Ingresses
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dhaba-prod.duckdns.org
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - dhaba-prod.duckdns.org
            secretName: dhaba-prod-tls

  # Higher limits than staging, and spread replicas over nodes when there is
  # more than one (ScheduleAnyway, so it still works on our single node)
  - target:
      kind: Deployment
      name: (web|orders-api|stats-api)
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "300m"
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchExpressions:
                - key: app
                  operator: Exists

  - target:
      kind: Deployment
      name: menu-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "384Mi"
